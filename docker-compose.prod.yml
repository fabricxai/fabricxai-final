# FabricXAI — single-factory production deployment.
#
# One VPS, one factory, one database. That is the shape the product is for, and this file
# is deliberately the smallest thing that is defensible rather than a Kubernetes on-ramp:
# an ERP that a Bangladeshi factory's own IT person has to keep running at 2am should be
# readable in one sitting.
#
#   caddy      TLS termination and the only published ports (80/443)
#   app        Next.js — the HTTP surface
#   worker     BullMQ — schedules, event consumers, notifications
#   migrate    one-shot; runs migrations and provisions roles, then exits
#   postgres   the database
#   pgbouncer  transaction pooling, scram auth, no password on disk
#   redis      queues; AOF on, noeviction, password-protected
#   minio      object storage for documents
#
# Bring up:      docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Deploy a build: see docs/runbooks/deploy.md — migrate runs BEFORE app/worker start.
#
# WHAT IS NOT HERE, and must be, before real factory data (audit INFRA-B3):
#   backups. `docker/backup/` and docs/runbooks/restore.md cover pgBackRest and MinIO
#   mirroring; until a restore has been REHEARSED once against a scratch host, this
#   deployment has an undefined RPO and should not hold a payroll.

name: fabricxai

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:?set APP_URL to the https:// address the factory uses}
  BETTER_AUTH_URL: ${APP_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate with openssl rand -base64 32}
  # Through the pooler, as the non-owner app role. This is the connection RLS binds.
  DATABASE_URL: postgres://${APP_DB_USER:-fabricxai_app_rw}:${APP_DB_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-fabricxai}
  # Direct, as the owner. Migrations only — the app asserts at boot that this role is
  # NOT the one it serves requests with.
  DIRECT_DATABASE_URL: postgres://${POSTGRES_USER:-fabricxai}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-fabricxai}
  REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
  # Server-side endpoint, reachable only on the compose network.
  S3_ENDPOINT: http://minio:9000
  # Browser-facing endpoint for presigned upload/download URLs. WITHOUT THIS, every
  # upload from a floor tablet fails: SigV4 signs the Host header, so a URL signed for
  # `minio:9000` cannot be rewritten client-side and the tablet cannot resolve it
  # anyway (audit INFRA-H1). Caddy proxies /s3/* to minio.
  S3_PUBLIC_ENDPOINT: ${APP_URL}/s3
  S3_BUCKET: ${S3_BUCKET:-fabricxai}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: ${SMTP_HOST:?a real SMTP host — mailpit is dev-only}
  SMTP_PORT: ${SMTP_PORT:-587}
  EMAIL_FROM: ${EMAIL_FROM:?}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  # Optional. Set it and errors are aggregated and alertable; leave it and the app warns
  # at startup and logs to stdout only. Logs are structured JSON either way.
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Bearer token for /api/health/jobs — the route the worker's own healthcheck is disabled
  # in favour of (see the worker service below). WITHOUT IT the route refuses with a 503
  # and says so, deliberately: it names every scheduled task and what is currently broken,
  # which is reconnaissance rather than a status page. Generate with `openssl rand -hex 24`.
  HEALTH_TOKEN: ${HEALTH_TOKEN:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  # Off until a real provider is registered (audit AI-B1). With it on, env.ts requires
  # at least one of the three keys below — not all three, as it used to.
  # Enabling this requires ANTHROPIC_API_KEY specifically, not just any of the three: the
  # assistant button and /marbim do exactly one thing, ask the reason model, so a
  # Gemini-only deployment ships a copilot that renders perfectly and fails on every
  # question (plan 6.4).
  MARBIM_ENABLED: ${MARBIM_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

# Every long-running service gets these. Logs are capped because a factory VPS with a
# full disk is a factory with no ERP, and the default json-file driver grows forever.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  caddy:
    <<: *service
    image: caddy:2.8-alpine
    container_name: fxai-caddy
    # The ONLY published ports in this file. Postgres, Redis and MinIO are reachable
    # only on the compose network — a database published to 0.0.0.0 on a VPS is found
    # by a scanner within hours.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?the bare hostname, e.g. erp.example.com — Caddy gets its certificate for this}
      TLS_EMAIL: ${TLS_EMAIL:?an address Let's Encrypt can reach about expiry}
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *service
    image: ${IMAGE:?the image reference to deploy, e.g. ghcr.io/org/fabricxai@sha256:…}
    container_name: fxai-app
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Read-only root filesystem: nothing in the app writes to disk. Next needs a
    # writable cache dir, so that one path is a tmpfs rather than the whole tree.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # LIVENESS, and only that (plan 7.5). `/api/health` answers 200 because the request
    # arrived; it touches no dependency, so a database blip can no longer make Docker
    # restart a process that is serving requests perfectly well. Readiness is Caddy's
    # question — see the active health check on the upstream — because taking an instance
    # out of ROTATION and restarting it are different remedies for different faults.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1200M

  worker:
    <<: *service
    image: ${IMAGE:?}
    container_name: fxai-worker
    command: ['tsx', 'src/worker/index.ts']
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker serves no HTTP, so it must NOT inherit the image's HEALTHCHECK — it
    # would be permanently unhealthy and either flap restarts or teach the operator to
    # ignore health status entirely (audit INFRA-H4). Its liveness is observable
    # instead through /api/health/jobs on the app, which reports a schedule that has
    # stopped firing.
    healthcheck:
      disable: true
    # Long enough for the graceful drain in worker/index.ts to finish a job in flight.
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 900M

  # One-shot. Runs to completion before app and worker start, which is the whole point:
  # nothing at boot stops a new image serving requests against an un-migrated schema, so
  # the ordering is enforced here rather than remembered (audit INFRA-H5).
  #
  # Safe to re-run — migrations are forward-only and the role setup is idempotent, so
  # this is also the rotation procedure for the app and pooler passwords.
  migrate:
    image: ${IMAGE:?}
    container_name: fxai-migrate
    restart: 'no'
    command: ['sh', '-c', 'tsx src/db/migrate.ts && node scripts/setup-db-roles.mjs']
    environment:
      <<: *app-env
      # Only this service needs it: it is what writes the pooler's lookup password.
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?generate with openssl rand -base64 24}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *service
    image: pgvector/pgvector:pg16
    container_name: fxai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabricxai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-fabricxai}
      # scram for client auth, and initdb writes it into pg_hba.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    command:
      - postgres
      # WAL settings a backup tool needs. Set here rather than left to pgBackRest's
      # installer so the database is ready for archiving the day it is configured, and
      # so turning backups on is not also a restart of the database.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Replaced by pgBackRest's own command when backups land; `true` until then, which
      # archives nothing and blocks nothing.
      - -c
      - archive_command=true
      - -c
      - max_wal_senders=3
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fabricxai} -d ${POSTGRES_DB:-fabricxai}']
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2G

  pgbouncer:
    <<: *service
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: fxai-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The production config: scram + auth_query, no application password on disk.
      - ./docker/pgbouncer/pgbouncer.prod.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # ONE line, for pgbouncer_auth only, written at deploy time and never committed.
      # docs/runbooks/deploy.md generates it. NOT the dev userlist.txt.
      - ${PGBOUNCER_USERLIST:-./secrets/pgbouncer-userlist.txt}:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 6432 -U ${APP_DB_USER:-fabricxai_app_rw} -d ${POSTGRES_DB:-fabricxai}'
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *service
    image: redis:7-alpine
    container_name: fxai-redis
    # AOF on and noeviction are not tuning, they are correctness for BullMQ: an evicted
    # key is a job that silently never runs, and there is no record that it existed.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      resources:
        limits:
          memory: 700M

  minio:
    <<: *service
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fxai-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Browser-facing base for presigned URLs, matching S3_PUBLIC_ENDPOINT.
      MINIO_BROWSER_REDIRECT_URL: ${APP_URL}/s3
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 700M

  # One-shot bucket setup: private ACL and versioning. Versioning matters more than it
  # looks — a re-uploaded challan photo overwriting the one a customs officer already
  # saw is not recoverable without it.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fxai-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        mc version enable "local/$$S3_BUCKET"
        echo "[minio-init] $$S3_BUCKET is private and versioned"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:-fabricxai}

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy-data:
  caddy-config:
