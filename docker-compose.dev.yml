# FabricXAI — local development stack (dev-plan §3).
# Same shape as prod: dev adds Mailpit, drops Caddy/pgBackRest.
#
#   docker compose -f docker-compose.dev.yml up -d          # infra only; run app with `pnpm dev`
#   docker compose -f docker-compose.dev.yml --profile full up -d   # + app + worker in containers
#
# Host ports are deliberately non-default (pg on 5433) so a system Postgres or
# Redis already running on this machine does not collide.

name: fabricxai-dev

services:
  postgres:
    # pgvector build of the official PG16 image; pg_trgm and btree_gin ship with contrib.
    image: pgvector/pgvector:pg16
    container_name: fxai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabricxai
      POSTGRES_PASSWORD: fabricxai
      POSTGRES_DB: fabricxai
      # Deterministic collation — index ordering must not drift between machines.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    command:
      - postgres
      # Slow-query log reviewed weekly during phases 3–6 (dev-plan §8).
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=100
    ports:
      # DIRECT_DATABASE_URL — migrations only, bypassing the pooler.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fabricxai -d fabricxai']
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    # Transaction mode: Next.js route concurrency exhausts raw PG connections.
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: fxai-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Config is mounted rather than generated from env: the env-driven form forces a
    # single server-side user, which would hand the app the owner's privileges and make
    # RLS inapplicable. See docker/pgbouncer/pgbouncer.ini.
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # DATABASE_URL — all application traffic, as the non-owner app role.
      - '6432:6432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U fabricxai -d fabricxai']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fxai-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fxai-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: fabricxai
      MINIO_ROOT_PASSWORD: fabricxai-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the private documents bucket. No public buckets, ever (dev-plan §6).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fxai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 fabricxai fabricxai-dev-secret &&
        mc mb --ignore-existing local/fabricxai-documents &&
        mc anonymous set none local/fabricxai-documents &&
        echo "bucket ready (private)"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fxai-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '1025:1025' # SMTP — Better Auth verification mail lands here
      - '8025:8025' # web UI
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Optional: run app + worker in containers too (`--profile full`) ──────────
  app:
    profiles: ['full']
    image: node:22-bookworm-slim
    container_name: fxai-app
    working_dir: /app
    command: ['sh', '-c', 'corepack enable && pnpm install --frozen-lockfile && pnpm dev']
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fabricxai_app_rw:fabricxai-app-dev-secret@pgbouncer:6432/fabricxai
      DIRECT_DATABASE_URL: postgres://fabricxai:fabricxai@postgres:5432/fabricxai
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    env_file: [.env]
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    profiles: ['full']
    image: node:22-bookworm-slim
    container_name: fxai-worker
    working_dir: /app
    command: ['sh', '-c', 'corepack enable && pnpm install --frozen-lockfile && pnpm worker:dev']
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fabricxai_app_rw:fabricxai-app-dev-secret@pgbouncer:6432/fabricxai
      DIRECT_DATABASE_URL: postgres://fabricxai:fabricxai@postgres:5432/fabricxai
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    env_file: [.env]
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres-data:
  redis-data:
  minio-data:
