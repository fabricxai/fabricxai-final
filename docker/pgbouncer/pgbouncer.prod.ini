; PgBouncer — PRODUCTION.
;
; Differs from pgbouncer.ini (dev) in exactly one respect that matters: no password
; file. Dev keeps `auth_type = plain` with a cleartext userlist, which is fine for a
; compose file whose passwords are already in .env.example and fatal anywhere real.
;
; Here the pooler authenticates clients by SCRAM and fetches the verifier from
; Postgres through `app.pgbouncer_get_auth` (migration 0070) — so the application
; role's password exists in exactly one place, the database, and a copy of this
; container yields nothing.
;
; The critical line is still in [databases]: there is NO `user=`. Setting one makes
; PgBouncer open every server connection as that role regardless of who connected,
; which would silently hand the app the owner's privileges and make row level
; security inapplicable. Forwarding the client's own role is what keeps wall 2 real.

[databases]
fabricxai = host=postgres port=5432 dbname=fabricxai

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ── Authentication ─────────────────────────────────────────────────────────────
;
; SCRAM end to end. PgBouncer never holds a plaintext password for any application
; role: it reads a verifier and performs the exchange.
auth_type = scram-sha-256

; The role PgBouncer connects as to run auth_query. It can do nothing else —
; NOINHERIT, no table grants, EXECUTE on one function. Its own password is the only
; credential this container needs, and it is supplied at deploy time (see below).
auth_user = pgbouncer_auth
auth_query = SELECT username, password FROM app.pgbouncer_get_auth($1)

; auth_file holds ONE line, for pgbouncer_auth alone, and is written at deploy time
; from PGBOUNCER_AUTH_PASSWORD — never committed, never baked into an image. See
; docs/runbooks/deploy.md. If this file is absent PgBouncer refuses to start, which
; is the correct failure: a pooler that cannot authenticate should not accept
; traffic it will then fail to serve.
auth_file = /etc/pgbouncer/userlist.txt

; ── Pooling ────────────────────────────────────────────────────────────────────
;
; Transaction mode: a server connection returns to the pool at COMMIT. This is why
; tenancy uses SET LOCAL / set_config(..., true) inside the transaction and never a
; connection-level SET — the next client would inherit it, and it would inherit a
; company id.
pool_mode = transaction

max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5

; Recycle server connections so a long-lived pool cannot outlive a credential
; rotation or accumulate per-connection state. Absent in dev, where nothing runs
; long enough for it to matter.
server_lifetime = 3600
server_idle_timeout = 600

; A client that cannot be given a server connection within this many seconds gets
; an error instead of hanging. A floor tablet posting a batch needs to be told the
; system is saturated — it queues locally and retries — rather than waiting on a
; socket until its own timeout fires.
query_wait_timeout = 20

; Server-side prepared statements do not survive transaction pooling; postgres.js is
; configured with prepare:false to match.
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits,options

; ── Administration ─────────────────────────────────────────────────────────────
;
; Deliberately NOT the owner role, and deliberately not the app role: the console is
; for an operator with a shell on the host, and the two roles that matter for data
; should have no reason to appear here.
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

; Connection logging on. Volume is low (a pool of 25 recycled hourly) and knowing
; which role connected when is the first thing anyone asks after an incident.
log_connections = 1
log_disconnections = 1
