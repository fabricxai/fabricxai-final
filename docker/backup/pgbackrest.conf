# pgBackRest — offsite backups for the single-factory deployment.
#
# The dev plan calls this "non-negotiable before first real factory data" and sets
# RTO ≤ 4h / RPO ≤ 15min. Those numbers are what shaped this file:
#
#   RPO 15min → WAL is archived continuously, not just at the nightly full backup. A
#               daily dump alone means losing up to a day of a factory's GRNs, cut
#               reports and hourly output — a day nobody can reconstruct, because the
#               paper it came from has moved on.
#   RTO 4h    → the repository is S3-compatible and offsite, so a restore does not
#               depend on the failed host, and `--delta` restores only what changed.
#
# The repository MUST NOT be the same MinIO this deployment runs. A backup on the box
# you are recovering from is not a backup. Point repo1 at Cloudflare R2, Backblaze B2,
# or any S3 host that is somewhere else.

[global]
repo1-type=s3
repo1-path=/fabricxai
repo1-s3-bucket=${PGBACKREST_BUCKET}
repo1-s3-endpoint=${PGBACKREST_ENDPOINT}
repo1-s3-region=${PGBACKREST_REGION}
repo1-s3-key=${PGBACKREST_KEY}
repo1-s3-key-secret=${PGBACKREST_SECRET}
repo1-s3-uri-style=path

# Encrypted at rest with a passphrase this deployment holds and the storage provider
# does not. Losing this passphrase loses the backups, so it belongs in the same place as
# the other production secrets — and a copy belongs somewhere that survives the factory.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}

# 4 full backups, and every incremental in between, retained. At this database's size
# that is roughly a month of history — long enough that a corruption discovered on
# Monday can be escaped to a point before it.
repo1-retention-full=4

# Compression on the client so what crosses the factory's uplink is small. Bangladeshi
# factory internet is the constraint here, not CPU.
compress-type=zst
compress-level=6

# Two processes: enough to saturate a modest uplink, not enough to compete with the ERP
# for the CPU the floor is waiting on.
process-max=2

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Verify every backup's checksums as it is written. A backup that cannot be restored is
# worse than no backup, because it is believed.
repo1-bundle=y
archive-async=y
spool-path=/var/spool/pgbackrest

[fabricxai]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-host=postgres
pg1-user=fabricxai
